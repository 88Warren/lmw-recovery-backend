name: Build & Deploy Backend

# ── Trigger: push a version tag e.g. git tag v1.0.2 && git push origin v1.0.2
on:
  push:
    tags:
      - 'v*.*.*'

# ── Repo-specific config ─────────────────────────────────────────────────────
env:
  IMAGE_NAME:      lmwcode/lmw-recovery-backend
  HELM_RELEASE:    lmwrecovery-backend
  HELM_NAMESPACE:  lmw-recovery
  HELM_CHART_PATH: /opt/lmwrecovery/lmwrecovery-helmcharts/backend
  HELM_IMAGE_KEY:  api.image.tag
  HEALTH_URL:      https://api.lmwrecovery.co.uk/health

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Quality checks (lint + build)
  # ────────────────────────────────────────────────────────────────────────────
  check:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m --allow-parallel-runners

      - name: Build verification
        run: CGO_ENABLED=0 go build ./...

      - name: Run tests
        run: go test ./... -v -timeout 60s

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build image, scan, deploy (only if checks pass)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build → Scan → Push → Deploy
    runs-on: ubuntu-latest
    needs: check

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract version tag ───────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Set up QEMU + buildx for multi-arch ───────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to Docker Hub ───────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Build image locally for scanning (single arch, no push yet) ────────
      - name: Build image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      # ── 6. Security scan with Trivy ───────────────────────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # ── 7. Build & push multi-arch image ─────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 8. Deploy to VPS via SSH ──────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            helm upgrade ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.HELM_NAMESPACE }} \
              --set ${{ env.HELM_IMAGE_KEY }}=${{ steps.tag.outputs.VERSION }} \
              --reuse-values

      # ── 9. Post-deploy health check ───────────────────────────────────────────
      - name: Wait for rollout
        run: sleep 20

      - name: Health check
        run: |
          echo "Resolving DNS for api.lmwrecovery.co.uk..."
          nslookup api.lmwrecovery.co.uk || echo "DNS lookup failed — domain may not be propagated yet"

          echo "Running health check against ${{ env.HEALTH_URL }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 3 --retry-delay 5 ${{ env.HEALTH_URL }} 2>&1) || STATUS="curl_error_$?"
          echo "Health check status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check returned: $STATUS"
            echo "This may be expected if DNS is not yet propagated or TLS is not yet active."
            echo "The deployment itself completed successfully — check the API manually."
          fi

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### ✅ Deployed ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.HELM_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | ✅ |" >> $GITHUB_STEP_SUMMARY
