name: Build & Deploy Backend

# ── Trigger: push a version tag e.g. git tag v1.0.2 && git push origin v1.0.2
on:
  push:
    tags:
      - 'v*.*.*'

# ── Repo-specific config ─────────────────────────────────────────────────────
env:
  IMAGE_NAME:       lmwcode/lmw-recovery-backend
  HELM_RELEASE:     lmwrecovery-backend
  HELM_NAMESPACE:   lmw-recovery
  HELM_CHART_PATH:  /opt/lmwrecovery/lmwrecovery-helmcharts/backend
  HELM_IMAGE_KEY:   api.image.tag

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract version tag ───────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Set up QEMU + buildx for multi-arch ───────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to Docker Hub ───────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Build & push multi-arch image ─────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 6. Deploy to VPS via SSH ──────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            helm upgrade ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.HELM_NAMESPACE }} \
              --set ${{ env.HELM_IMAGE_KEY }}=${{ steps.tag.outputs.VERSION }} \
              --reuse-values

      # ── 7. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### ✅ Deployed ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "Namespace: \`${{ env.HELM_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
